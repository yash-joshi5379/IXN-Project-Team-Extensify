name: smolvla-gpu-train
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - ffmpeg=6.1.2
  - cuda-toolkit=12.1 
  - wandb
  - pip
  - pip:
    - torch==2.4.0
    - torchvision==0.19.0
    - torchaudio==2.4.0
    # index-url handled via: pip install torch --index-url https://download.pytorch.org/whl/cu121
 
    # ── WandB  ────────────────────────────────────────────────────────────
    # Kept in pip (not conda) because the conda-forge package lags behind.
    - wandb