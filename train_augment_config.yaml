dataset:
  root: /scratch0/yjoshi/IXN-Project-Team-Extensify/dataset-v2-pro
  image_transforms:
    enable: true
    max_num_transforms: 5
    random_order: true
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.7, 1.3]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.6, 1.4]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.5, 1.5]
      hue:
        weight: 0.0
        type: ColorJitter
        kwargs:
          hue: [-0.05, 0.05]
      sharpness:
        weight: 1.0
        type: SharpnessJitter
        kwargs:
          sharpness: [0.5, 1.5]
      rotation:
        weight: 1.0
        type: RandomRotation
        kwargs:
          degrees: [-5.0, 5.0]
          expand: false